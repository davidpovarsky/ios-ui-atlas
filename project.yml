name: iOSUIAtlas
options:
  bundleIdPrefix: com.davidpovarsky
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  CatalogModel:
    path: Packages/CatalogModel
  CatalogDemos:
    path: Packages/CatalogDemos

targets:
  iOSUIAtlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/iOSUIAtlas
    dependencies:
      - package: CatalogModel
      - package: CatalogDemos
    settings:
      base:
        PRODUCT_NAME: iOSUIAtlas
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.ios-ui-atlas
        INFOPLIST_FILE: App/iOSUIAtlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  iOSUIAtlasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/iOSUIAtlasTests
    dependencies:
      - target: iOSUIAtlas
      - package: CatalogModel
      - package: CatalogDemos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.ios-ui-atlas.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  iOSUIAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/iOSUIAtlasUITests
    dependencies:
      - target: iOSUIAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.ios-ui-atlas.uitests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  iOSUIAtlas:
    build:
      targets:
        iOSUIAtlas: all
        iOSUIAtlasTests: [test]
        iOSUIAtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iOSUIAtlasTests
        - iOSUIAtlasUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
